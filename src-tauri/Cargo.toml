[package]
name = "re-edit-pdf-desktop"
version = "2.0.0-alpha.2"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Re-Edit PDF desktop shell"

[features]
custom-protocol = ["tauri/custom-protocol"]
desktop-test = []

[[bin]]
name = "Re-Edit-PDF"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
re-edit-pdf-native = { path = "../native", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
tempfile = "3"
url = "2"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
wait-timeout = "0.2"
docx-rs = "0.4"
pdf_signer = "=0.2.0"
percent-encoding = "2"
font-kit = "0.14"

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.39.1" }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
