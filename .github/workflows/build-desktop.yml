name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Runner OS list as JSON
        default: '["windows-latest", "ubuntu-22.04"]'
permissions:
  contents: read
jobs:
  packages:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native build and desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libfontconfig1-dev librsvg2-dev patchelf rpm squashfs-tools xvfb xauth dbus-x11 xdg-utils desktop-file-utils cups-client libreoffice-writer
      - name: Windows compiler and redistributable paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/rust-env.ps1
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
          "MUPDF_MSVC_PLATFORM_TOOLSET=$env:MUPDF_MSVC_PLATFORM_TOOLSET" >> $env:GITHUB_ENV
          $crt = Get-ChildItem -LiteralPath (Join-Path $vsRoot 'VC/Redist/MSVC') -Filter 'Microsoft.VC*.CRT' -Directory -Recurse | Where-Object { $_.Parent.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'MSVC runtime redistributables not found' }
          "REEDIT_CRT_DIR=$($crt.FullName)" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - name: Renderer tests and native core tests
        shell: bash
        env:
          READIT_TEST_OFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          npm run typecheck:web
          npx vitest run --reporter=dot
          cargo test --locked -p re-edit-pdf-native -p re-edit-pdf-desktop --no-default-features
      - name: Prepare packaging configuration
        run: node scripts/prepare-native-package.mjs
      - name: Windows setup EXE and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/rust-env.ps1
          npx tauri build --ci --bundles nsis,msi --config release/native-build-config.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - name: Linux DEB RPM and AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --ci --bundles deb,rpm,appimage --config release/native-build-config.json
      - name: Collect production packages and provenance
        run: node scripts/collect-native-packages.mjs
      - name: Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -LiteralPath "release/portable/Re-Edit-PDF-$version" -DestinationPath "release/native-packages/Re-Edit-PDF-$version-windows-x64-portable.zip"
      - name: Corresponding native MuPDF source
        if: runner.os == 'Linux'
        run: |
          source_dir=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name mupdf-sys-0.8.0 -print -quit)
          test -f "$source_dir/mupdf/COPYING"
          tar -czf release/native-packages/mupdf-native-source-1.27.2.tar.gz -C "$(dirname "$source_dir")" mupdf-sys-0.8.0
      - name: Build isolated application validation executable
        run: cargo build --release --locked -p re-edit-pdf-desktop --features custom-protocol,desktop-test
      - name: Windows runtime checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:REEDIT_TEST_SUITE = 'fonts-dialog'
          ./scripts/measure-desktop.ps1 -Executable target/release/Re-Edit-PDF.exe
          Copy-Item release/native-validation/tauri/result.json release/native-validation/tauri/fonts-dialog-result.json
          node scripts/generate-ocr-paper.mjs
          $env:REEDIT_TEST_SUITE = 'ocr-edit'
          ./scripts/measure-desktop.ps1 -Executable target/release/Re-Edit-PDF.exe -Fixture release/native-validation/tauri/ocr-paper.pdf
          Copy-Item release/native-validation/tauri/result.json release/native-validation/tauri/ocr-edit-result.json
          node scripts/generate-ocr-paper.mjs --image-only
          node scripts/generate-layout-fixtures.mjs
          foreach ($suite in @('editing-regression','updates','interactions','ocr-recognition','layout-stability')) {
            $fixture = switch ($suite) {
              'ocr-recognition' {'release/native-validation/tauri/ocr-image-only.pdf'}
              'layout-stability' {'release/validation-oct17/layout/mixed-pages.pdf'}
              default {'test-fixtures/simple-text.pdf'}
            }
            ./scripts/test-local-webview.ps1 -Suite $suite -Fixture $fixture -Executable target/release/Re-Edit-PDF.exe
          }
          $env:REEDIT_TEST_SUITE = 'smoke'
          ./scripts/measure-desktop.ps1 -Executable target/release/Re-Edit-PDF.exe
          Copy-Item release/native-validation/tauri/result.json release/native-validation/tauri/open-close-result.json
          ./scripts/test-native-installer.ps1
          ./scripts/test-native-msi.ps1
      - name: Linux native WebView smoke test
        if: runner.os == 'Linux'
        run: |
          sh scripts/test-native-linux.sh target/release/Re-Edit-PDF ubuntu-22.04
          node scripts/generate-ocr-paper.mjs --image-only
          node scripts/generate-layout-fixtures.mjs
          sh scripts/test-native-linux-regressions.sh target/release/Re-Edit-PDF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: re-edit-pdf-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/native-packages/*
            release/native-validation/**/*.json
            release/native-validation/**/*.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: native-validation-tools-Linux
          path: target/release/Re-Edit-PDF
  distributions:
    if: contains(inputs.platforms, 'ubuntu')
    needs: packages
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, fedora:43]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: re-edit-pdf-Linux
          path: release/downloaded
      - uses: actions/download-artifact@v4
        with:
          name: native-validation-tools-Linux
          path: release/validation-tool
      - name: Install and launch distribution package
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" -w /work '${{ matrix.image }}' sh scripts/test-native-distro.sh '${{ matrix.image }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-distro-${{ strategy.job-index }}
          path: |
            release/native-validation/distros/**/result.json
            release/native-validation/distros/**/package-result.json
