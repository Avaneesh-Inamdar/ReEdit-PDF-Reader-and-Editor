name: Validate Windows installer
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the Windows packages to validate
        required: true
      setup_run:
        description: Optional run containing repaired-windows-setup to overlay
        required: false
permissions:
  contents: read
  actions: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          name: re-edit-pdf-Windows
          path: release
      - uses: actions/download-artifact@v4
        if: inputs.setup_run != ''
        with:
          run-id: ${{ inputs.setup_run }}
          github-token: ${{ github.token }}
          name: repaired-windows-setup
          path: release
      - name: Install and uninstall exact release package
        run: ./scripts/test-native-installer.ps1
      - name: Install launch and uninstall MSI
        run: ./scripts/test-native-msi.ps1
      - name: Production startup close
        run: |
          $version=(Get-Content -Raw package.json | ConvertFrom-Json).version
          Expand-Archive -LiteralPath "release/native-packages/Re-Edit-PDF-$version-windows-x64-portable.zip" -DestinationPath release/startup-package
          ./scripts/test-startup-close.ps1 -Executable "release/startup-package/Re-Edit-PDF-$version/Re-Edit-PDF.exe"
      - name: Installer diagnostics
        if: always()
        run: |
          Get-ChildItem -LiteralPath $env:TEMP -Filter 'ReEditPDF-Installer-Test-*' -Directory | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName | Select-Object Name,Length }
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error','Windows Error Reporting') } | Select-Object TimeCreated,Message | Format-List
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-validation-${{ matrix.attempt }}
          path: |
            release/native-validation/tauri/windows-installer-result.json
            release/native-validation/tauri/windows-msi-result.json
            release/native-validation/startup-close/result.json
