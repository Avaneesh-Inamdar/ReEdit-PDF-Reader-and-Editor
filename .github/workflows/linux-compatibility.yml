name: Validate Linux distributions
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the Linux native packages and validation executable
        required: true
permissions:
  contents: read
  actions: read
jobs:
  distributions:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, fedora:43]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          name: re-edit-pdf-Linux
          path: release/downloaded
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          name: native-validation-tools-Linux
          path: release/validation-tool
      - name: Install and launch distribution package
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" -w /work '${{ matrix.image }}' sh scripts/test-native-distro.sh '${{ matrix.image }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-distro-${{ strategy.job-index }}
          path: |
            release/native-validation/distros/**/result.json
            release/native-validation/distros/**/package-result.json
