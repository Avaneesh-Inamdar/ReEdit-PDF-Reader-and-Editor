appId: com.avaneeshinamdar.readitpdf
productName: Re-Edit PDF
copyright: Copyright © 2026 Avaneesh Inamdar
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/icon.ico
  - build/icon.png
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md
asar: true
asarUnpack:
  - resources/**
  - node_modules/mupdf/**
win:
  executableName: Re-Edit-PDF
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Re-Edit PDF
  uninstallDisplayName: Re-Edit PDF
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  differentialPackage: false
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  runAfterFinish: false
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  executableName: re-edit-pdf
  executableArgs: ["%F"]
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  maintainer: Avaneesh Inamdar <104128879+Avaneesh-Inamdar@users.noreply.github.com>
  category: Office
  mimeTypes: [application/pdf]
  desktop:
    Name: Re-Edit PDF
    Comment: Read, annotate, and edit PDF documents
    StartupWMClass: re-edit-pdf
    Keywords: PDF;Reader;Editor;
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  compression: gz
rpm:
  fpm: ["--rpm-compression", "gzip"]
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
