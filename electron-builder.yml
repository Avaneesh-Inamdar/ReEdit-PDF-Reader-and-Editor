appId: com.avaneeshinamdar.readitpdf
productName: Readit PDF Reader and Editor
copyright: Copyright © 2026 Avaneesh Inamdar
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asar: true
asarUnpack:
  - resources/**
win:
  executableName: Readit-PDF-Editor
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  sign: null
  verifyUpdateCodeSignature: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Readit PDF Reader and Editor
  uninstallDisplayName: Readit PDF Reader and Editor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  differentialPackage: false
  displayLanguageSelector: false
  runAfterFinish: true
  menuCategory: Readit PDF Reader and Editor
  include: build/installer.nsh
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    icon: build/icon.ico
    role: Editor
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: pdfeditor.app
  category: Office
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
