[package]
name = "re-edit-pdf-native"
version = "2.0.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native Rust desktop PDF reader and editor"
publish = false

[features]
default = ["native-ui"]
native-ui = ["dep:eframe"]

[[bin]]
name = "re-edit-pdf-lab"
path = "src/main.rs"
required-features = ["native-ui"]

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "system-fonts", "tesseract", "docx-output", "bundled-fonts-noto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rfd = "0.15"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
ureq = { version = "3", features = ["json"] }
url = "2"
font-kit = "0.14"
flate2 = "1"

[build-dependencies]
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security"] }

[dev-dependencies]
proptest = "1"
